name: エントリータイミング監視(取引時間中・5分おき)

concurrency:
  group: intraday-watch
  cancel-in-progress: true

on:
  schedule:
    # 前場9:00-11:30・後場12:30-15:30(JST)を5分おきに監視。昼休みはスクリプト内でスキップ判定
    - cron: "*/10 0-6 * * 1-5"
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: JST日付を取得
        id: date
        run: echo "jst_date=$(date -u -d '+9 hours' +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 候補銘柄(candidates.json)を復元
        uses: actions/cache/restore@v4
        with:
          path: state/candidates.json
          key: candidates-${{ steps.date.outputs.jst_date }}-${{ github.run_id }}
          restore-keys: |
            candidates-${{ steps.date.outputs.jst_date }}-

      - name: 当日分の通知済み状態を復元
        uses: actions/cache/restore@v4
        with:
          path: state/notified_intraday.json
          key: notified-intraday-${{ steps.date.outputs.jst_date }}-${{ github.run_id }}
          restore-keys: |
            notified-intraday-${{ steps.date.outputs.jst_date }}-

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install yfinance requests

      - name: 買いスコアを判定して通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python intraday_watch.py

      - name: 通知済み状態を保存(次回実行のため)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/notified_intraday.json
          key: notified-intraday-${{ steps.date.outputs.jst_date }}-${{ github.run_id }}
